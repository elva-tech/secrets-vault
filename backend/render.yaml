services:
  - type: web
    name: secrets-vault-api
    runtime: node
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SERVE_WEB
        value: "false"
      - key: WEB_ORIGIN
        sync: false
      - key: VAULT_BASE_DOMAIN
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: SESSION_COOKIE_SAMESITE
        value: none
      - key: VAULT_ENCRYPTION_MASTER_KEY
        sync: false
